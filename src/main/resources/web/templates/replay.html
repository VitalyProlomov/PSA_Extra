<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Poker Replay</title>
    <style>
        .balance-increase { animation: pulse-green 1s; }
        .balance-decrease { animation: pulse-red 1s; }
        @keyframes pulse-green { 0% { color: #2ecc71; } 100% { color: inherit; } }
        @keyframes pulse-red { 0% { color: #e74c3c; } 100% { color: inherit; } }
        .action-badge { display: none; padding: 4px 8px; background: #3498db; color: white; border-radius: 4px; }
        .action-badge.show { display: inline-block; }
        .card-rect { width: 40px; height: 60px; border: 1px solid #333; display: none; }
        .card-rect.hearts, .card-rect.diamonds { color: red; }
        .card-rect.spades, .card-rect.clubs { color: black; }
        .card-rank { display: none; font-weight: bold; }
        .card-back { display: block; }
    </style>

    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<div id="potLabel">POT: </div>
<div id="heroBalanceLabel"></div>
<div id="heroActionBadge" class="action-badge"></div>
<!-- Add opponent seats similarly with IDs: player1BalanceLabel, player1ActionBadge, etc. -->

<button id="nextActionBtn">Next</button>
<button id="restartBtn">Restart</button>

<script th:src="@{/js/replay.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const gameId = [[${gameId}]];
    let sessionId = null;
    let pokerReplay = null;  // Hold the class instance

    // Standalone CSRF helpers (NOT inside class - accessible globally)
    function _getCsrfToken() {
        return {
            header: document.querySelector('meta[name="_csrf_header"]')?.content,
            token: document.querySelector('meta[name="_csrf"]')?.content
        };
    }

    async function _fetchWithCsrf(url, options = {}) {
        const { header, token } = _getCsrfToken();
        options.headers = {
            'Content-Type': 'application/json',
            ...(options.headers || {})
        };
        if (header && token) {
            options.headers[header] = token;
        }
        const response = await fetch(url, options);
        if (response.status === 403) {
            console.warn('CSRF token invalid, reloading...');
            window.location.reload();
            throw new Error('CSRF token expired');
        }
        return response;
    }

    document.addEventListener('DOMContentLoaded', async () => {
        // Initialize the class first
        if (typeof PokerReplayViewer !== 'undefined') {
            pokerReplay = new PokerReplayViewer();
        }

        // Setup button listeners
        const nextBtn = document.getElementById('nextActionBtn');
        const restartBtn = document.getElementById('restartBtn');
        if (nextBtn) nextBtn.onclick = nextAction;
        if (restartBtn) restartBtn.onclick = resetReplay;

        // Start replay if game data exists
        if (window.gameData) {
            await initializeReplay();
        }
    });

    async function initializeReplay() {
        try {
            const response = await _fetchWithCsrf('/api/replay/initialize', {
                method: 'POST',
                body: JSON.stringify({ game: window.gameData })
            });
            const data = await response.json();  // ✅ Fixed: was 'res.json()'
            if (data.success) {
                sessionId = data.sessionId;
                if (pokerReplay && typeof pokerReplay.updateUI === 'function') {
                    pokerReplay.updateUI(data.state);
                } else {
                    updateUI(data.state);  // Fallback to global function
                }
            }
        } catch (e) {
            console.error('Init error:', e);
        }
    }

    async function nextAction() {
        if (!sessionId) return;
        try {
            const response = await _fetchWithCsrf(`/api/replay/${sessionId}/next`, {
                method: 'POST'
            });
            const data = await response.json();
            if (data.success) {
                if (pokerReplay && typeof pokerReplay.updateUI === 'function') {
                    pokerReplay.updateUI(data.state);
                } else {
                    updateUI(data.state);
                }
            }
        } catch (e) {
            console.error('Next action error:', e);
        }
    }

    async function resetReplay() {
        if (!sessionId) return;
        try {
            const response = await _fetchWithCsrf(`/api/replay/${sessionId}/reset`, {
                method: 'POST'
            });
            const data = await response.json();
            if (data.success) {
                if (pokerReplay && typeof pokerReplay.resetAllStates === 'function') {
                    pokerReplay.resetAllStates();
                }
                if (pokerReplay && typeof pokerReplay.updateUI === 'function') {
                    pokerReplay.updateUI(data.state);
                } else {
                    updateUI(data.state);
                }
            }
        } catch (e) {
            console.error('Reset error:', e);
        }
    }

    // ✅ Global updateUI function (fallback if class method not available)
    function updateUI(state) {
        if (!state) return;

        // Pot
        const potEl = document.getElementById('potLabel');
        if (potEl && state.pot !== undefined) {
            potEl.textContent = `POT: ${formatMoney(state.pot)}$`;
        }

        // Hero balance
        if (state.balances && state.balances['Hero'] !== undefined) {
            const heroBalance = state.balances['Hero'];
            const heroEl = document.getElementById('heroBalanceLabel');
            if (heroEl) {
                const oldText = heroEl.textContent;
                heroEl.textContent = `${formatMoney(heroBalance)}$`;
                if (oldText && heroBalance > parseFloat(oldText)) {
                    heroEl.classList.add('balance-increase');
                    setTimeout(() => heroEl.classList.remove('balance-increase'), 1000);
                }
            }
        }

        // Action badges
        if (state.players) {
            for (const [id, player] of Object.entries(state.players)) {
                if (player.lastAction) {
                    const prefix = id === 'Hero' ? 'hero' : `player${id}`;
                    const badge = document.getElementById(`${prefix}ActionBadge`);
                    if (badge) {
                        badge.textContent = player.lastAction.displayText;
                        badge.className = `action-badge show action-${player.lastAction.type.toLowerCase()}`;
                    }
                }
            }
        }

        // Community cards
        if (state.communityCards) {
            const cc = state.communityCards;
            if (cc.flopVisible && cc.flopCards) {
                ['flopCard1','flopCard2','flopCard3'].forEach((slotId, i) => {
                    if (cc.flopCards[i]) renderCard(slotId, cc.flopCards[i]);
                });
            }
            if (cc.turnVisible && cc.turnCard) {
                renderCard('turnCard', cc.turnCard);
            }
            if (cc.riverVisible && cc.riverCard) {
                renderCard('riverCard', cc.riverCard);
            }
        }
    }

    function renderCard(slotId, card) {
        if (!card) return;
        const rect = document.getElementById(`${slotId}Rect`);
        const rank = document.getElementById(`${slotId}Rank`);
        if (rect && rank) {
            rect.className = `card-rect ${card.suit.toString().toLowerCase()}`;
            rect.style.display = 'block';
            rank.textContent = rankChar(card.rank);
            rank.style.display = 'flex';
        }
    }

    function rankChar(rank) {
        const map = {TWO:'2',THREE:'3',FOUR:'4',FIVE:'5',SIX:'6',SEVEN:'7',EIGHT:'8',NINE:'9',
                     TEN:'T',JACK:'J',QUEEN:'Q',KING:'K',ACE:'A'};
        return map[rank?.toString()] || '?';
    }

    function formatMoney(amount) {
        if (amount === undefined || amount === null) return '0.00';
        return (Math.round(amount * 100) / 100).toFixed(2).replace(',', '.');
    }
    /*]]>*/
</script>
</body>
</html>
