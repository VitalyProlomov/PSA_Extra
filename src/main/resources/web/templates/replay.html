<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Poker Hand Replay</title>
    <link rel="stylesheet" th:href="@{/css/replay.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="main-container">
    <!-- Game Info Panel -->
    <div class="info-panel">
        <div class="info-item">Game ID: <span th:text="${game.gameId}"></span></div>
        <div class="info-item">Date: <span th:text="${game.date}"></span></div>
        <div class="info-item">Pot Type: <span th:text="${potType}"></span></div>
        <div class="info-item">Players Post Flop: <span th:text="${game.playersPostFlop}"></span></div>
        <div class="info-item">Hero Win/Loss: <span th:text="${game.heroWinLoss}"></span></div>
        <div class="info-item">Total Pot: <span th:text="${game.finalPot}"></span></div>
    </div>

    <!-- Poker Table Container -->
    <div class="table-wrapper">
        <div class="table-container">
            <!-- Table Ellipse -->
            <div class="table-ellipse"></div>

            <!-- Community Cards -->
            <div class="community-cards">
                <div class="card-slot" id="flopCard1">
                    <div class="card-rect" id="flopCard1Rect"></div>
                    <div class="card-rank" id="flopCard1Rank"></div>
                </div>
                <div class="card-slot" id="flopCard2">
                    <div class="card-rect" id="flopCard2Rect"></div>
                    <div class="card-rank" id="flopCard2Rank"></div>
                </div>
                <div class="card-slot" id="flopCard3">
                    <div class="card-rect" id="flopCard3Rect"></div>
                    <div class="card-rank" id="flopCard3Rank"></div>
                </div>
                <div class="card-slot" id="turnCard">
                    <div class="card-rect" id="turnCardRect"></div>
                    <div class="card-rank" id="turnCardRank"></div>
                </div>
                <div class="card-slot" id="riverCard">
                    <div class="card-rect" id="riverCardRect"></div>
                    <div class="card-rank" id="riverCardRank"></div>
                </div>
            </div>

            <!-- Pot Display -->
            <div class="pot-display" id="potLabel">POT: </div>

            <!-- Hero Seat -->
            <div class="seat seat-hero" id="seat-hero">
                <img class="dealer-button" id="heroButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="heroActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="heroLeftCardRect"></div>
                        <div class="card-rank" id="heroLeftCardRank"></div>
                        <img class="card-back" id="heroLeftCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="heroRightCardRect"></div>
                        <div class="card-rank" id="heroRightCardRank"></div>
                        <img class="card-back" id="heroRightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="heroPositionLabel"></div>
                    <div class="balance-label" id="heroBalanceLabel"></div>
                </div>
            </div>

            <!-- Opponent Seats 1-8 -->
            <div class="seat seat-opponent" id="seat-1">
                <img class="dealer-button" id="player1ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player1ActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="player1LeftCardRect"></div>
                        <div class="card-rank" id="player1LeftCardRank"></div>
                        <img class="card-back" id="player1LeftCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="player1RightCardRect"></div>
                        <div class="card-rank" id="player1RightCardRank"></div>
                        <img class="card-back" id="player1RightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="player1PositionLabel"></div>
                    <div class="balance-label" id="player1BalanceLabel"></div>
                </div>
            </div>

            <div class="seat seat-opponent" id="seat-2">
                <img class="dealer-button" id="player2ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">

                        <div class="card-rank" id="player2RightCardRank"></div>
                        <img class="card-back" id="player2RightCardBack" th:src="@{/assets/cardBackImage.png}">

                <div class="player-info">
                    <div class="position-label" id="player2PositionLabel"></div>
                    <div class="balance-label" id="player2BalanceLabel"></div>
                </div>
            </div>

            <div class="seat seat-opponent" id="seat-3">
                <img class="dealer-button" id="player3ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player3ActionBadge"></div>
                <div class="cards-container">

                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="player3RightCardRect"></div>

                </div>
                <div class="player-info">
                    <div class="position-label" id="player3PositionLabel"></div>
                    <div class="balance-label" id="player3BalanceLabel"></div>
                </div>
            </div>

            <div class="seat seat-opponent" id="seat-4">
                <img class="dealer-button" id="player4ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player4ActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="player4LeftCardRect"></div>
                        <div class="card-rank" id="player4LeftCardRank"></div>
                        <img class="card-back" id="player4LeftCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="player4RightCardRect"></div>
                        <div class="card-rank" id="player4RightCardRank"></div>
                        <img class="card-back" id="player4RightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="player4PositionLabel"></div>

            </div>

            <div class="seat seat-opponent" id="seat-5">
                <img class="dealer-button" id="player5ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player5ActionBadge"></div>
                <div class="cards-container">

                    <div class="card-slot-player">
                        <div class="card-rect" id="player5RightCardRect"></div>
                        <div class="card-rank" id="player5RightCardRank"></div>

                </div>
                <div class="player-info">
                    <div class="position-label" id="player5PositionLabel"></div>
                    <div class="balance-label" id="player5BalanceLabel"></div>
                </div>
            </div>

            <div class="seat seat-opponent" id="seat-6">
                <img class="dealer-button" id="player6ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player6ActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="player6LeftCardRect"></div>
                        <div class="card-rank" id="player6LeftCardRank"></div>
                        <img class="card-back" id="player6LeftCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="player6RightCardRect"></div>
                        <div class="card-rank" id="player6RightCardRank"></div>
                        <img class="card-back" id="player6RightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="player6PositionLabel"></div>
                    <div class="balance-label" id="player6BalanceLabel"></div>
                </div>
            </div>

            <div class="seat seat-opponent" id="seat-7">
                <img class="dealer-button" id="player7ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player7ActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="player7LeftCardRect"></div>
                        <div class="card-rank" id="player7LeftCardRank"></div>
                        <img class="card-back" id="player7LeftCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="player7RightCardRect"></div>
                        <div class="card-rank" id="player7RightCardRank"></div>
                        <img class="card-back" id="player7RightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="player7PositionLabel"></div>

            </div>

            <div class="seat seat-opponent" id="seat-8">
                <img class="dealer-button" id="player8ButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="player8ActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="player8LeftCardRect"></div>

                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="player8RightCardRect"></div>
                        <div class="card-rank" id="player8RightCardRank"></div>
                        <img class="card-back" id="player8RightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="player8PositionLabel"></div>
                    <div class="balance-label" id="player8BalanceLabel"></div>
                </div>
            </div>

            <!-- Controls -->
            <div class="next-action-btn" id="nextActionBtn" title="Next Action">
                <div class="triangle"></div>
            </div>
            <div class="restart-btn" id="restartBtn" title="Restart">
                <img th:src="@{/assets/restartIcon.png}" alt="Restart">
            </div>
        </div>
    </div>
</div>

<!-- Embed Game JSON for JavaScript -->
<script th:inline="javascript">
    /*<![CDATA[*/
    console.log("=== Loading Game Data ===");
    try {
        window.gameData = JSON.parse([[${gameJson}]]);
        console.log("✅ Game data loaded successfully!");
    } catch (e) {
        console.error("❌ Failed to parse game JSON:", e);
        window.gameData = null;
    }
    /*]]>*/
</script>

<script th:src="@{/js/replay.js}"></script>
</body>
</html>
