<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Poker Hand Replay</title>
    <link rel="stylesheet" th:href="@{/css/replay.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="main-container">
    <!-- Game Info Panel -->
    <div class="info-panel">
        <div class="info-item">Game ID: <span th:text="${game.gameId}"></span></div>
        <div class="info-item">Date: <span th:text="${formattedDate}"></span></div>
        <div class="info-item">Pot Type: <span th:text="${potType}"></span></div>
        <div class="info-item">Players Post Flop: <span th:text="${playersPostFlop}"></span></div>
        <div class="info-item">Hero Win/Loss: <span th:text="${heroWinLossFormatted}"></span></div>
        <div class="info-item">Total Pot: <span th:text="${totalPotFormatted}"></span></div>
    </div>

    <!-- Poker Table Container -->
    <div class="table-wrapper">
        <div class="table-container">
            <div class="table-ellipse"></div>

            <!-- Community Cards -->
            <div class="community-cards">
                <div class="card-slot" id="flopCard1"><div class="card-rect" id="flopCard1Rect"></div><div class="card-rank" id="flopCard1Rank"></div></div>
                <div class="card-slot" id="flopCard2"><div class="card-rect" id="flopCard2Rect"></div><div class="card-rank" id="flopCard2Rank"></div></div>
                <div class="card-slot" id="flopCard3"><div class="card-rect" id="flopCard3Rect"></div><div class="card-rank" id="flopCard3Rank"></div></div>
                <div class="card-slot" id="turnCard"><div class="card-rect" id="turnCardRect"></div><div class="card-rank" id="turnCardRank"></div></div>
                <div class="card-slot" id="riverCard"><div class="card-rect" id="riverCardRect"></div><div class="card-rank" id="riverCardRank"></div></div>
            </div>

            <!-- Pot Display -->
            <div class="pot-display" id="potLabel">POT: </div>

            <!-- Hero Seat -->
            <div class="seat seat-hero" id="seat-hero">
                <img class="dealer-button" id="heroButtonIcon" th:src="@{/assets/dealerButton.png}" style="display:none;">
                <div class="action-badge" id="heroActionBadge"></div>
                <div class="cards-container">
                    <div class="card-slot-player">
                        <div class="card-rect" id="heroLeftCardRect"></div>
                        <div class="card-rank" id="heroLeftCardRank"></div>
                        <img class="card-back" id="heroLeftCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                    <div class="card-slot-player">
                        <div class="card-rect" id="heroRightCardRect"></div>
                        <div class="card-rank" id="heroRightCardRank"></div>
                        <img class="card-back" id="heroRightCardBack" th:src="@{/assets/cardBackImage.png}">
                    </div>
                </div>
                <div class="player-info">
                    <div class="position-label" id="heroPositionLabel">Hero</div>
                    <div class="balance-label" id="heroBalanceLabel"></div>
                </div>
            </div>

            <!-- Opponent Seats (1-8) - Same structure as your original -->
            <th:block th:each="i : ${#numbers.sequence(1, 8)}">
                <div class="seat seat-opponent" th:id="'seat-' + ${i}">
                    <img class="dealer-button" th:id="'player' + ${i} + 'ButtonIcon'" th:src="@{/assets/dealerButton.png}" style="display:none;">
                    <div class="action-badge" th:id="'player' + ${i} + 'ActionBadge'"></div>
                    <div class="cards-container">
                        <div class="card-slot-player">
                            <div class="card-rect" th:id="'player' + ${i} + 'LeftCardRect'"></div>
                            <div class="card-rank" th:id="'player' + ${i} + 'LeftCardRank'"></div>
                            <img class="card-back" th:id="'player' + ${i} + 'LeftCardBack'" th:src="@{/assets/cardBackImage.png}">
                        </div>
                        <div class="card-slot-player">
                            <div class="card-rect" th:id="'player' + ${i} + 'RightCardRect'"></div>
                            <div class="card-rank" th:id="'player' + ${i} + 'RightCardRank'"></div>
                            <img class="card-back" th:id="'player' + ${i} + 'RightCardBack'" th:src="@{/assets/cardBackImage.png}">
                        </div>
                    </div>
                    <div class="player-info">
                        <div class="position-label" th:id="'player' + ${i} + 'PositionLabel'">Player <span th:text="${i}"></span></div>
                        <div class="balance-label" th:id="'player' + ${i} + 'BalanceLabel'"></div>
                    </div>
                </div>
            </th:block>

            <!-- Controls -->
            <div class="controls">
                <!-- ✅ Next Action Button - Now has proper ID and click handler -->
                <div class="next-action-btn" id="nextActionBtn" title="Next Action (Space)">
                    <div class="triangle"></div>
                </div>
                <!-- ✅ Restart Button - Now correctly links back to /hands -->
                <a th:href="@{/hands}" class="restart-btn" id="restartBtn" title="Back to Hands">
                    <img th:src="@{/assets/restartIcon.png}" alt="Restart">
                </a>
            </div>
        </div>
    </div>
</div>

<!-- ✅ Embed Game JSON - Must match controller attribute name -->
<script th:inline="javascript">
    /*<![CDATA[*/
    // Controller adds: model.addAttribute("gameJson", ...)
    window.gameData = /*[[${gameJson}]]*/ {};

    // Card suit to CSS class mapping (used by replay.js)
    window.suitClasses = {
        'HEARTS': 'card-hearts',
        'DIAMONDS': 'card-diamonds',
        'CLUBS': 'card-clubs',
        'SPADES': 'card-spades'
    };
    /*]]>*/
</script>

<!-- ✅ Pure JavaScript file (NOT HTML) -->
<script th:src="@{/js/replay.js}"></script>
</body>
</html>
